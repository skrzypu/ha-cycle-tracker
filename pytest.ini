[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --strict-config
# pytest-homeassistant-custom-component ships async fixtures/tests that expect
# auto mode; without it HA's `hass` fixture resolves to an async generator.
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    contract: Contract tests
filterwarnings =
    ignore::DeprecationWarning
