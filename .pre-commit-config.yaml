repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        description: Type-check the integration against the real Home Assistant types.
        entry: mypy
        language: system
        files: ^custom_components/.*\.py$
        pass_filenames: false
        require_serial: true
        args: [custom_components/, --ignore-missing-imports, --explicit-package-bases]
      - id: pytest
        name: pytest
        description: Run the test suite from the development environment.
        entry: pytest -q
        language: system
        files: ^(custom_components|tests)/.*\.py$
        pass_filenames: false
        require_serial: true
